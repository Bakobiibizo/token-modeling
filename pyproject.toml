[project]
name = "modeling"
version = "0.1.0"
description = "Deterministic token-economy simulation and uncertainty analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.3",
    "pandas>=2.3.3",
    "pydantic>=2.11.9",
]

[project.optional-dependencies]
web = ["greeble", "fastapi>=0.115", "jinja2>=3.1", "matplotlib>=3.9", "python-multipart>=0.0.9", "uvicorn>=0.30"]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
token-model = "modeling.main:main"

[tool.uv.sources]
greeble = { git = "https://github.com/bakobiibizo/greeble" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modeling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
